<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Title/fonts/colours/sizes config -- see static/js/theme.js. Must load
     before the THEME BOOTSTRAP script below, which applies it. -->
<script src="static/js/theme.js"></script>

<!-- ============================================================
     THEME BOOTSTRAP -- must run before first paint to avoid a
     flash of the wrong theme. Reads localStorage first, falls
     back to the OS/browser prefers-color-scheme when the visitor
     has never chosen explicitly. applyTheme() (static/js/theme.js)
     then sets the CSS custom properties for that mode.
     ============================================================ -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      if (typeof applyTheme === "function") applyTheme(theme);
    } catch (e) {
      /* localStorage/matchMedia unavailable -- default light stylesheet applies. */
    }
  })();
</script>

<style>
  /* ==========================================================
     THEME TOKENS -- every rule below reads colours/fonts/sizes from
     these custom properties only, but DON'T edit the values here to
     re-skin the page: static/js/theme.js is the source of truth
     whenever JavaScript runs (which this page already requires for
     its content), and overwrites all of these at load time via
     applyTheme(). The literal values below only matter as a fallback
     for the (already heavily degraded) no-JS case.

     The green / purple / orange custom-property names are carried over
     from the "When Rubrics Fail" template unchanged, but their values are
     this paper's own palette (Legal_Reward_Modelling/arxiv_release.tex,
     "COLOUR PALETTE"): green slot = PrimaryGold #DEB73F, purple slot =
     SteelBlue #6F95C4, orange slot = BrownOrange #D08A52. "dark" =
     border / large bold text, "mid" = fill tone, "light" = background
     tint, "text" = a darkened variant used for small body text so it
     still clears WCAG AA (4.5:1) on the warm background -- a few of the
     paper's raw "dark" values fall just short at body-text size, so
     don't swap `--*-text` for `--*-dark` without rechecking contrast.
     ========================================================== */
  :root {
    /* Light theme (default) */
    --color-bg: #F5F0E6;
    --color-surface: #FBF7EF;
    --color-text: #2A2521;
    --color-text-muted: #6E6759;
    --color-border: #DED4C0;
    --color-rule: #C9BC9E;

    --green-dark: #A5831C;
    --green-mid: #DEB73F;
    --green-light: #FAF3E0;
    --green-text: #826816;

    --purple-dark: #648DC0;
    --purple-mid: #6F95C4;
    --purple-light: #E8EEF6;
    --purple-text: #436EA4;

    --orange-dark: #C87736;
    --orange-mid: #D08A52;
    --orange-light: #F7ECE3;
    --orange-text: #9C5D2A;

    --color-link: var(--green-text);
    --color-link-hover: #57450F;
    --color-focus: var(--green-text);

    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;

    --content-width: 900px;
    /* Shared width for body paragraphs and their figures, so a figure
       never reads wider than the text around it. Both get centred at
       this width inside the wider --content-width wrap. */
    --prose-width: 700px;
    --radius: 10px;
    --radius-pill: 999px;
  }

  [data-theme="dark"] {
    --color-bg: #1E1A16;
    --color-surface: #28231E;
    --color-text: #EDE6D8;
    --color-text-muted: #A79C8A;
    --color-border: #3A332B;
    --color-rule: #453D33;

    /* Dark mode reuses the paper's brighter "mid" tones for both borders
       and dark (they already clear AA on the dark background), and swaps
       the pastel "light" tints for desaturated dark equivalents rather
       than the literal light-theme hex values, which would be jarring
       here. */
    --green-dark: #DEB73F;
    --green-mid: #DEB73F;
    --green-light: #584922;
    /* Muted on purpose: the paper's raw gold reads as glaring at link/
       author-name text size on a dark ground, even though it clears
       contrast. This desaturated tone still clears AA (7.8:1 on the page
       background) without the glare. */
    --green-text: #C8AC55;

    --purple-dark: #6F95C4;
    --purple-mid: #6F95C4;
    --purple-light: #363F4A;
    --purple-text: #7B96B8;

    --orange-dark: #D08A52;
    --orange-mid: #D08A52;
    --orange-light: #533C28;
    --orange-text: #BE8C64;

    --color-link: var(--green-text);
    --color-link-hover: #E5C565;
    --color-focus: var(--green-text);
  }

  /* ========================================================== */

  * { box-sizing: border-box; }

  html {
    background: var(--color-bg);
    /* Reserves room for the sticky header (see header.site-header below)
       so a jump to a section/heading doesn't land it partly underneath
       the header. --header-height is measured and kept live by
       updateHeaderHeightVar() in main.js (it changes if the header wraps
       to two rows on narrow screens); the fallback is a same-origin no-JS
       guess at its single-row height. Respected by both scrollIntoView()
       (our own click handler, static/js/main.js) and the browser's native
       #anchor jump (e.g. a direct link, or with JS disabled). */
    scroll-padding-top: var(--header-height, 64px);
  }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
    font-size: var(--font-size-body, 17px);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;

  img { max-width: 100%; height: auto; display: block; }

  /* Justify body prose so paragraph edges line up with the figures
     above/below them, rather than reading narrower on the right due to
     left-aligned ragged text. Applies only to actual paragraphs of prose
     (not short centred lines like the correspondence line or one-line
     captions), and pairs with hyphens so justification doesn't open up
     large gaps at this column width. */
  .prose, .tldr p, figcaption, .implications li, .caveat, .stat-callout {
    text-align: justify;
    hyphens: auto;
  }

  /* Every block of body prose is capped at --prose-width and centred,

  .prose, .implications ol, .caveat {

  }
  .tldr strong { font-family: var(--font-serif); }

  /* ---------- Hero result ---------- */
  .hero-result { text-align: center; }
  .hero-result h2 {
    max-width: var(--prose-width);
    margin: 0 auto 0.7em;
  }
  /* Figures share --prose-width with the body text and are centred at
     that width, rather than stretching to the full wrap and reading
     wider than the paragraphs around them (figcaption has no width of
     its own -- it simply fills its now-constrained <figure> parent). */
  .hero-result figure { max-width: var(--prose-width); margin: 2em auto 0.8em; }
  .hero-result figcaption {
    font-size: 0.92rem;
    color: var(--color-text-muted);
  }
  figure img { border-radius: 20px; }

  /* ---------- Figure placement (content.md "position: left/right") ----------
     Default (no position, or "center") is the centred layout set by each
     section's own figure rule above/below (.hero-result figure,
     .finding figure, #method figure). These two classes -- toggled by
     static/js/content.js from an image slot's optional "position:" line --
     override that with a floated figure so body text wraps beside it,
     across all three contexts (hence repeating the selector per section:
     #method's own rule is ID-scoped, so a plain ".fig-left" class rule
     wouldn't out-specificity it). */
  .hero-result figure.fig-left, .finding figure.fig-left, #method figure.fig-left,
  .hero-result figure.fig-right, .finding figure.fig-right, #method figure.fig-right {
    max-width: 45%;
  }
  .hero-result figure.fig-left, .finding figure.fig-left, #method figure.fig-left {
    float: left;
    margin: 0.3em 24px 1em 0;
  }
  .hero-result figure.fig-right, .finding figure.fig-right, #method figure.fig-right {
    float: right;
    margin: 0.3em 0 1em 24px;
  }
  /* Below ~600px there's no room for text to wrap beside a 45%-wide
     figure -- fall back to the default centred, full-width layout. */
  @media (max-width: 600px) {
    figure.fig-left, figure.fig-right {
      float: none;
      max-width: var(--prose-width);
      margin: 1.4em auto;
    }
  }

  /* ---------- Key Takeaways ---------- */
  /* One under another, not side by side -- same column width as the rest
     of the page's prose/figures/table (see --prose-width note above). */
  .takeaways-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: var(--prose-width);
    margin: 0 auto;
  }
  .takeaway {
    display: block;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 0.98rem;
    /* It's a link (to the matching Results finding) -- reset the default
       <a> look so it still reads as a card, not a text link. */
    color: inherit;
    text-decoration: none;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .takeaway:hover, .takeaway:focus-visible {
    background: var(--green-light);
    border-color: var(--green-dark);
  }
  /* The bold lead-in sentence is coloured but stays in the card's own body
     font -- unlike .tldr strong / .stat-callout strong, which switch to
     serif. */
  .takeaway strong { color: var(--green-text); }
  /* ---------- Findings ---------- */
  /* No divider rules between findings -- whitespace and the numbered
     headings separate them. Own block-formatting context (see .wrap
     above) so a floated figure in one finding can't bleed into the
     next finding's heading. */
  .finding { padding: 40px 0; display: flow-root; }
  .finding:first-of-type { padding-top: 0; }
  /* Each result's own title -- scales with the viewport like the section
     h2 above it does, but from a slightly lower ceiling so the section
     heading still reads as the level above it. */
  .finding h3 {
    font-size: clamp(1.4rem, 2.2vw, 1.75rem);
    max-width: var(--prose-width);
    margin-left: auto;
    margin-right: auto;
  }
  .finding figure { max-width: var(--prose-width); margin: 1.4em auto; }
  .finding figcaption { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 0.5em; }
  .colour-swatch { font-weight: 600; }
  /* Highlighted pull-out box. Currently unused -- the one finding that had
     one has been removed -- but kept as a reusable piece of this template:
     add <div class="stat-callout" data-md="some-slot"></div> anywhere and
     give it a matching block in content.md. */
  .stat-callout {
    display: block;
    /* Same column width as the prose paragraph above it (see the
       --prose-width note) rather than the full .wrap width. */
    max-width: var(--prose-width);
    margin: 0.8em auto 0;
    padding: 10px 16px;
    background: var(--purple-light);
    border-radius: var(--radius);
    font-size: 0.95rem;
  }
  .stat-callout strong { font-family: var(--font-serif); color: var(--purple-text); }

  /* ---------- Method ---------- */
  /* Taxonomy / Pipeline / Clinical Review subsection labels. Sized clearly
     above body text (they read as bold body copy at ~1.1rem) but well below
     .finding h3, so the page keeps three distinct heading levels: section
     h2 > result title > method subsection. */
  #method h3 {
    font-size: 1.25rem;
    max-width: var(--prose-width);
    margin: 2.2em auto 0.6em;
  }
  #method figure { max-width: var(--prose-width); margin: 1.6em auto; }
  #method figcaption { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 0.5em; }

  /* ---------- Markdown tables (static/js/tables.js) ----------
     Generic styling for ANY table rendered by tables.js from a Markdown
     file -- not specific to the taxonomy table. A new table anywhere on
     the page automatically gets this look; nothing to add per-table. */
  .table-scroll {
    overflow-x: auto;
    /* Same column width as every other block of prose/figures on the page
       (see --prose-width note above) -- previously unconstrained, so it
       filled the full --content-width wrap and read wider than the text
       around it. Still scrolls internally if a table needs more room than
       that on narrow screens. */
    max-width: var(--prose-width);
    margin: 1.6em auto 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
  }
  .md-table {
    width: 100%;
    min-width: 480px;
    border-collapse: collapse;
    font-size: 0.92rem;
    /* Fixed layout so the column widths below (percentages, keyed off the
       header row) are actually enforced -- under the default "auto"
       layout, a wide unwrapped cell can still stretch its column past a
       given width. Needed for the first column to stay narrow and wrap
       instead of forcing the whole table wide. */
    table-layout: fixed;
  }
  .md-table th,
  .md-table td {
    text-align: left;
    padding: 13px 16px;
    border-bottom: 1px solid var(--color-border);
    vertical-align: top;
    line-height: 1.5;
    /* Column 1 (the row's label/term) stays compact rather than sizing to
       its longest entry; column 3, where present, gets a bit less than
       column 2 (its body-text description) -- reasonable proportions for
       a 3-column table generally, not tuned to the taxonomy table's exact
       column count (see tables.js). A 2-column table simply ignores the
       nth-child(3) rule. */
    overflow-wrap: break-word;
    hyphens: auto;
  }
  .md-table th:nth-child(1), .md-table td:nth-child(1) { width: 26%; }
  .md-table th:nth-child(3), .md-table td:nth-child(3) { width: 32%; }
  .md-table thead th {
    background: var(--color-surface);
    font-family: var(--font-serif);
    font-weight: 700;
    /* Same tone as the emphasised phrases inside the table (.md-table em
       below), so the header rule and the in-cell emphasis read as one
       accent rather than two unrelated colours. */
    border-bottom: 2px solid var(--orange-text);
  }
  /* Zebra striping: a shade darker than the page background rather than a
     colour tint, so a table reads as its own component without pulling in
     an accent colour that doesn't mean anything here. Derived from the
     existing border tone rather than a new token -- adapts with the
     theme/dark mode automatically. */
  .md-table tbody tr:nth-child(even) { background: color-mix(in srgb, var(--color-bg), var(--color-border) 55%); }
  /* In dark mode, the formula above lands only a few RGB points off
     --color-surface (thead's own background, and the Key Takeaways cards'
     background just below) -- close enough to read as an unintentional
     mismatch rather than two deliberately different tones. Override to the
     exact same token there so the stripe, the header row, and the takeaway
     cards all share one "offset" surface colour. Light mode is left on the
     formula above, where it lands on a clearly distinct, more visibly
     "recessed" stripe rather than nearly (but not quite) matching
     --color-surface's brighter "raised card" tone. */
  [data-theme="dark"] .md-table tbody tr:nth-child(even) { background: var(--color-surface); }
  .md-table tbody tr:last-child td { border-bottom: none; }
  /* First column reads as the row's label/term -- a reasonable default
     for most tables (see tables.js). Wraps (see overflow-wrap above)
     rather than forcing the column wide to fit unbroken. */
  .md-table td.md-table-key { font-weight: 600; font-family: var(--font-serif); }
  /* Inline emphasis inside any cell: *italic* is a key/erroneous phrase
     (in the accent colour also used for "critical error" emphasis
     elsewhere on the page), ~~strikethrough~~ is a superseded/incorrect
     value struck through and muted. */
  .md-table em { font-style: italic; color: var(--orange-text); }
  .md-table s { color: var(--color-text-muted); }
  /* Below ~600px there's no room for 3 columns -- drop the 3rd (in the
     taxonomy table, "Example") entirely rather than shrinking every
     column to the point of being unreadable; column 1 gets a little more
     room since it's now the only "compact" column doing wrapping work. */
  @media (max-width: 600px) {
    .md-table { min-width: 0; }
    .md-table th:nth-child(3), .md-table td:nth-child(3) { display: none; }
    .md-table th:nth-child(1), .md-table td:nth-child(1) { width: 34%; }
    .md-table th, .md-table td { padding: 10px 12px; font-size: 0.88rem; }
  }

  /* ---------- Implications ---------- */
  .implications ol {
    padding-left: 1.2em;
    max-width: 720px;
  }
  .implications li { margin-bottom: 1em; }
  .caveat {
    margin-top: 1.6em;
    font-size: 0.88rem;
    color: var(--color-text-muted);
    max-width: 720px;
  }

  /* ---------- Citation ---------- */
  /* Same column width as every other block on the page (prose, figures,
     the takeaway cards, the taxonomy table) -- it otherwise filled the
     wider --content-width wrap and read broader than everything above it.
     position: relative anchors the absolutely-positioned copy button, so
     capping the width here keeps that button on the box's own corner. */
  .cite-block {
    position: relative;
    margin: 1.4em auto 0;
    max-width: var(--prose-width);
  }
  #bibtex-block {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 20px;
    padding-top: 44px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    white-space: pre;
    margin: 0;
  }
  #copy-bibtex-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 0.8rem;
    padding: 6px 12px;
  }
  #copy-bibtex-btn.copied { border-color: var(--green-dark); color: var(--green-text); }
  .bibtex-note {
    /* Sits above .cite-block (a citation-context note, e.g. "presented at
       workshop X" -- see content.md's bibtex-note slot), not below it. */
    font-size: 0.85rem;
    color: var(--color-text-muted);
    max-width: var(--prose-width);
    margin: 0.6em auto 1em;
  }

  /* ---------- Footer ---------- */
  .site-footer {
    border-top: 1px solid var(--color-border);
    padding: 24px 0 40px;
  }
  .site-footer .wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--color-text-muted);
  }
  .site-footer p { margin: 0; }
  .site-footer a { color: var(--color-text-muted); }
  .site-footer a:hover { color: var(--color-link); }

  noscript .noscript-banner {
    display: block;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: 12px 24px;
    font-size: 0.88rem;
    text-align: center;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 768px) {
    section { padding: 40px 0; }
    .nav-inner { flex-wrap: wrap; row-gap: 10px; justify-content: center; }
    #site-nav { gap: 14px; }
  }
  @media (max-width: 480px) {
    body { font-size: var(--font-size-body-mobile, 16px); }
    .hero { padding-top: 40px; }
    #resource-buttons { gap: 8px; }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { scroll-behavior: auto !important; }
  }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<noscript>
  <div class="noscript-banner">
    JavaScript is off, so the page's text, author links, resource buttons,
    the taxonomy table, and the BibTeX block below won't render.
  </div>
</noscript>

<div id="scroll-progress" aria-hidden="true"></div>

<header class="site-header">
  <div class="nav-inner">
    <a class="wordmark" id="wordmark" href="#top"></a>
    <nav id="site-nav" aria-label="Section">
      <a href="#overview">Overview</a>
      <a href="#method">Method</a>
      <a href="#results">Results</a>
      <a href="#cite">Cite</a>
      <button id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">☾</button>
    </nav>
  </div>
</header>

<main id="main">

  <!-- ============================== HERO ============================== -->
  <section id="top" class="hero" aria-labelledby="hero-title">
    <div class="wrap">
      <!-- Rendered from static/js/theme.js (THEME.title) by main.js -->
      <h1 id="hero-title"></h1>

      <!-- Rendered from authors.yaml by main.js -->
      <ul id="author-list" aria-label="Authors"></ul>
      <p id="equal-contribution-note">* Equal contribution</p>

      <p class="correspondence">
        Correspondence: <span id="correspondence-name">[CORRESPONDING AUTHOR]</span>,
        <a id="correspondence-email" href="#">[EMAIL]</a>
      </p>

      <!-- Logos only, no institution text -- alt text (set from
           authors.yaml's affiliation) carries the names for
           screen readers. -->
      <p class="affiliation-block">
        <img class="oxford-logo" id="oxford-logo" src="static/logos/oxford.svg" alt="University of Oxford">
        <span id="oxai-logo-wrap" hidden>
          <img class="oxai-logo theme-only-light" src="static/logos/oxai_logo_final_black.png" alt="">
          <img class="oxai-logo theme-only-dark" src="static/logos/oxai_logo_final.png" alt="">
        </span>
      </p>

      <!-- Rendered from links.yaml by main.js -->
      <div id="resource-buttons" aria-label="Paper resources"></div>
    </div>
  </section>

  <!-- ============================== OVERVIEW ==============================
       TL;DR, the pull figure below, and Key Takeaways read as one
       continuous "Overview" -- the nav has a single Overview link, not one
       per part (see the border/padding reset for #overview, #problem,
       #takeaways in the CSS above). This first part is the TL;DR itself. -->
  <section id="overview" data-section-group="overview" aria-label="Overview">
    <div class="wrap">
      <!-- Text from content.md (slot: tldr) via static/js/content.js -->
      <div class="tldr" data-md="tldr"></div>
    </div>
  </section>

  <!-- ============================== OVERVIEW: PULL FIGURE ============================== -->
  <!-- An animated GIF, light/dark variants -- same theme-swap pattern as
       the OxAI logo above and the static Pipeline figure in Methodology
       (.theme-only-light/.theme-only-dark, toggled by the
       [data-theme="dark"] CSS rules). Each variant is its own content.md
       image slot (problem-image-light/-dark) since data-md-img only
       carries one src per element; both share one figcaption. Transparent
       canvas -- the diagram's own node boxes carry their fill (ink colour
       resolved per theme at render time, before export), so it sits
       directly on the page background in both themes with no card edge
       and no dark-mode background painting needed anywhere on this
       page's figures. -->
  <section id="problem" data-section-group="overview" class="hero-result" aria-labelledby="problem-title">
    <div class="wrap">
      <h2 id="problem-title" data-md="problem-title"></h2>

      <figure>
        <img data-md-img="problem-image-light" class="theme-only-light"
             src="static/images/legal-reward-pipeline.gif"
             alt="Animated pipeline diagram: a source dataset of gold passage, question, and answer triples flows into context construction, answer generation by four LLMs, response annotation by a judge model, and finally preference-pair construction.">
        <img data-md-img="problem-image-dark" class="theme-only-dark"
             src="static/images/legal-reward-pipeline-dark.gif"
             alt="Animated pipeline diagram: a source dataset of gold passage, question, and answer triples flows into context construction, answer generation by four LLMs, response annotation by a judge model, and finally preference-pair construction.">
        <figcaption data-md="problem-caption"></figcaption>
      </figure>
    </div>
  </section>

  <!-- ============================== OVERVIEW: KEY TAKEAWAYS ============================== -->
  <!-- Three scannable boxes, no figures -- a reader who stops here still has
       the paper's shape. Each box leads with the same bold sentence as its
       link target's heading (see content.md's takeaway-N slots), so a
       reader can jump straight to the evidence. Takeaways 2 and 3 link to
       their matching Results finding; takeaway 1 links up to Methodology
       (#method-title) instead, since that point IS the methodology, not a
       separate result -- see content.md's own header note. -->
  <section id="takeaways" data-section-group="overview" aria-labelledby="takeaways-title">
    <div class="wrap">
      <h2 id="takeaways-title" data-md="takeaways-title"></h2>
      <div class="takeaways-grid">
        <a class="takeaway" href="#method-title" data-md="takeaway-1"></a>
        <a class="takeaway" href="#finding-2-title" data-md="takeaway-2"></a>
        <a class="takeaway" href="#finding-3-title" data-md="takeaway-3"></a>
      </div>
    </div>
  </section>

  <!-- ============================== METHOD ============================== -->
  <!-- Three subsections -- Taxonomy, Pipeline, Validation -- each an <h3>
       inside this one section rather than separate top-level sections. -->
  <section id="method" data-section-group="method" aria-labelledby="method-title">
    <div class="wrap">
      <h2 id="method-title" data-md="method-title"></h2>
      <div class="prose" data-md="method-intro"></div>

      <!-- Displayed first: Source Dataset. Slot ids (method-validation-*)
           are unchanged from the template's own internal wiring -- only
           this element's position in the DOM was moved; see content.md's
           header note. -->
      <h3 id="method-validation-title" data-md="method-validation-title"></h3>
      <div class="prose" data-md="method-closing"></div>

      <!-- Displayed second: Pipeline. Theme-swapped, transparent canvas --
           same pattern as the Overview pull figure (see that section's
           comment for why: two content.md image slots, one figcaption,
           toggled via .theme-only-light/.theme-only-dark). Rendered
           directly from the same source SVG as the pull figure's GIFs
           (via gifit2me's `--preview` flag, not extracted from the GIF --
           a GIF frame looked dithered from the 256-colour palette), so
           ink colours still match exactly between the animated and
           static versions of this diagram. -->
      <h3 id="method-pipeline-title" data-md="method-pipeline-title"></h3>
      <figure>
        <img data-md-img="method-image-light" class="theme-only-light"
             src="static/images/figure-pipeline.png"
             alt="Pipeline diagram: context construction, answer generation by four LLMs, response annotation by a judge model, and preference-pair construction.">
        <img data-md-img="method-image-dark" class="theme-only-dark"
             src="static/images/figure-pipeline-dark.png"
             alt="Pipeline diagram: context construction, answer generation by four LLMs, response annotation by a judge model, and preference-pair construction.">
        <figcaption data-md="method-figcaption"></figcaption>
      </figure>
      <div class="prose" data-md="method-pipeline-body"></div>

      <!-- Displayed third: Preference Pair Examples (slot ids still say
           "taxonomy", carried over from the template -- see content.md). -->
      <h3 id="taxonomy-title" data-md="taxonomy-title"></h3>
      <div class="prose" data-md="taxonomy-intro"></div>
      <!-- Rendered from taxonomy.md by static/js/tables.js -- a generic
           Markdown-table loader, not specific to this table. -->
      <div class="table-scroll">
        <table data-md-table="taxonomy.md"></table>
      </div>
    </div>
  </section>

  <!-- ============================== RESULTS ============================== -->
  <!-- Unpacks the Overview's Key Takeaways with evidence -- but only
       takeaways 2 and 3: takeaway 1 ("Grounded Legal Reward Models") links
       up to Methodology (#method-title) instead of down here, since that
       point *is* the methodology, not a separate result. -->
  <section id="results" data-section-group="results" aria-label="Results">
    <div class="wrap">
      <!-- Point 2: DPO's reward-hacking sensitivity and the length-
           balanced-augmentation fix, evidenced by the LRB radar chart. -->
      <article class="finding" aria-labelledby="finding-2-title">
        <h3 id="finding-2-title" data-md="finding-2-title"></h3>
        <div class="prose" data-md="finding-2-body"></div>
        <figure>
          <img data-md-img="finding-2b-image-light" class="theme-only-light"
               src="static/images/spider_lrbv2_n4.svg"
               alt="Radar chart comparing four Ministral-8B training conditions on LegalRewardBench. The length-balanced-augmentation condition (gold) forms the largest polygon on every dimension.">
          <img data-md-img="finding-2b-image-dark" class="theme-only-dark"
               src="static/images/spider_lrbv2_n4_dark.svg"
               alt="Radar chart comparing four Ministral-8B training conditions on LegalRewardBench. The length-balanced-augmentation condition (gold) forms the largest polygon on every dimension.">
          <figcaption data-md="finding-2b-caption"></figcaption>
        </figure>
        <div class="prose" data-md="finding-2b-body"></div>
      </article>

      <!-- Point 3: reported in text, no figure -- same pattern as the
           template's own original finding-3. -->
      <article class="finding" aria-labelledby="finding-3-title">
        <h3 id="finding-3-title" data-md="finding-3-title"></h3>
        <div class="prose" data-md="finding-3-body"></div>
      </article>
    </div>
  </section>

  <!-- ============================== IMPLICATIONS / DISCUSSION ============================== -->
  <!-- Forward-looking close, not a generic conclusion -- class stays
       "implications" internally (CSS/no visible difference); heading text
       and section title come from content.md's implications-title slot. -->
  <section id="beyond" data-section-group="beyond" class="implications" aria-labelledby="implications-title">
    <div class="wrap">
      <h2 id="implications-title" data-md="implications-title"></h2>
      <ol data-md="implications-list"></ol>
    </div>
  </section>

  <!-- ============================== CITATION ============================== -->
  <section id="cite" data-section-group="cite" aria-labelledby="cite-title">
    <div class="wrap">
      <h2 id="cite-title" data-md="cite-title"></h2>
      <div class="bibtex-note" data-md="bibtex-note"></div>
      <div class="cite-block">
        <button id="copy-bibtex-btn" class="btn" type="button">Copy BibTeX</button>
        <pre id="bibtex-block"><!-- populated from citation.bib --></pre>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <div data-md="footer-note"></div>
    <a href="#top">Back to top ↑</a>
  </div>
</footer>

<script src="static/js/yaml-lite.js"></script>
<script src="static/js/content.js"></script>
<script src="static/js/tables.js"></script>
<script src="static/js/main.js"></script>
</body>
</html>
